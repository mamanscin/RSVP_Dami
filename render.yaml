databases:
  - name: rsvp-db
    plan: free
    databaseName: rsvp
    user: rsvp

services:
  - type: web
    name: rsvp-web
    runtime: docker
    rootDir: rsvpv2
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rsvp-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false