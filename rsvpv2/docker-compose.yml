services:
  # Run pending Prisma migrations, then exit.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    user: root
    command: >
      sh -c "chown -R nextjs:nodejs /data && chmod 775 /data && npx prisma migrate deploy || (npx prisma db push && chown -R nextjs:nodejs /data && chmod 775 /data)"
    environment:
      - DATABASE_URL=file:/data/dev.db
    volumes:
      - rsvp-data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=file:/data/dev.db
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - rsvp-data:/data
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.rsvp.rule=Host(`rsvp.pola-studios.com`)
      - traefik.http.routers.rsvp.entrypoints=websecure
      - traefik.http.routers.rsvp.tls=true
      - traefik.http.routers.rsvp.tls.certresolver=letsencrypt
      - traefik.http.routers.rsvp.service=rsvp
      - traefik.http.services.rsvp.loadbalancer.server.port=3000
    restart: unless-stopped

volumes:
  rsvp-data:

networks:
  proxy:
    external: true
    name: proxy
