services:
  # Run pending Prisma migrations, then exit.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    command: >
      sh -c "npx prisma migrate deploy 2>/dev/null || npx prisma db push"
    environment:
      - DATABASE_URL=file:/data/dev.db
    volumes:
      - rsvp-data:/data
    profiles:
      - setup

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # SQLite database path — persisted on a Docker volume so data survives
      # container restarts / updates.
      - DATABASE_URL=file:/data/dev.db
      # Set ADMIN_PASSWORD in a .env file (or in your shell) to enable the
      # /admin section. Omit or leave empty to disable admin access.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - rsvp-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  rsvp-data:
