services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rsvp
      POSTGRES_USER: rsvp
      POSTGRES_PASSWORD: rsvp_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsvp -d rsvp"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Run pending Prisma migrations, then exit.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    command: npx prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://rsvp:rsvp_dev_password@db:5432/rsvp?schema=public

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://rsvp:rsvp_dev_password@db:5432/rsvp?schema=public
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.rsvp.rule=Host(`rsvp.pola-studios.com`)
      - traefik.http.routers.rsvp.entrypoints=websecure
      - traefik.http.routers.rsvp.tls=true
      - traefik.http.routers.rsvp.tls.certresolver=letsencrypt
      - traefik.http.routers.rsvp.service=rsvp
      - traefik.http.services.rsvp.loadbalancer.server.port=3000
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  proxy:
    external: true
    name: proxy
