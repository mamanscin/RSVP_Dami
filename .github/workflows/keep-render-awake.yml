name: Keep Render service awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          APP_URL: https://rsvp-dami.onrender.com
        run: curl --fail --silent --show-error --max-time 30 "$APP_URL/api/health"