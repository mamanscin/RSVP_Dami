name: Keep Render service awake

on:
  schedule:
    # GitHub Actions cron uses UTC. These hours are 6:00 AM to 1:00 AM UTC+8.
    - cron: "*/10 0-16 * * *"
    - cron: "*/10 22-23 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          APP_URL: https://rsvp-dami.onrender.com
        run: curl --fail --silent --show-error --retry 8 --retry-delay 10 --retry-all-errors --max-time 30 --retry-max-time 180 "$APP_URL/api/health"